<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1120" id="theme-meta">
<title>Bell 412EPX Normal Checklist</title>
<link rel="manifest" id="pwa-manifest">
<style>
  :root {
    --bg: #0b1120;
    --sidebar-bg: #111827;
    --card: #1e293b;
    --subhead: #0f172a;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --warn-bg: rgba(239, 68, 68, 0.15);
    --warn-border: #ef4444;
    --caut-bg: rgba(245, 158, 11, 0.15);
    --caut-border: #f59e0b;
    --note-bg: rgba(56, 189, 248, 0.12);
    --done-bg: #3d003d;
    --done-border: #ff00ff;
    --border: #334155;
    --sidebar-w: 215px;
  }

  /* NVG GREEN MODES: DIM, MEDIUM, HIGH */
  body.nvg-dim {
    --bg: #000200; --sidebar-bg: #000500; --card: #010a01; --subhead: #000700;
    --text: #15803d; --muted: #14532d; --accent: #16a34a;
    --warn-bg: #031203; --warn-border: #16a34a;
    --caut-bg: #020e02; --caut-border: #15803d;
    --note-bg: #010901; --done-bg: #3d003d; --done-border: #ff00ff; --border: #052e16;
  }
  body.nvg-med {
    --bg: #000500; --sidebar-bg: #000a00; --card: #021402; --subhead: #010e01;
    --text: #22c55e; --muted: #16a34a; --accent: #4ade80;
    --warn-bg: #052205; --warn-border: #4ade80;
    --caut-bg: #041a04; --caut-border: #22c55e;
    --note-bg: #021202; --done-bg: #3d003d; --done-border: #ff00ff; --border: #14532d;
  }
  body.nvg-high {
    --bg: #000a00; --sidebar-bg: #011201; --card: #042104; --subhead: #021802;
    --text: #86efac; --muted: #4ade80; --accent: #bbf7d0;
    --warn-bg: #0a360a; --warn-border: #bbf7d0;
    --caut-bg: #072b07; --caut-border: #86efac;
    --note-bg: #041c04; --done-bg: #3d003d; --done-border: #ff00ff; --border: #166534;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding-right: var(--sidebar-w);
    transition: background 0.15s, color 0.15s;
  }

  /* Fixed Right-Hand Sidebar */
  aside {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--sidebar-w);
    background: var(--sidebar-bg); border-left: 2px solid var(--border);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 10px 8px; z-index: 1000;
  }
  .brand { text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .brand-title { font-weight: 900; font-size: 1rem; letter-spacing: 0.5px; }
  .brand-sub { font-size: 0.7rem; color: var(--muted); font-weight: 600; }

  nav { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; margin: 8px 0; flex-grow: 1; }
  nav a {
    display: flex; justify-content: space-between; align-items: center; text-decoration: none;
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    padding: 9px 8px; border-radius: 7px; font-weight: 700; font-size: 0.73rem; text-transform: uppercase;
  }
  nav a.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .badge { font-size: 0.68rem; padding: 2px 5px; border-radius: 8px; background: rgba(0,0,0,0.35); color: inherit; }

  .sidebar-controls { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 8px; }
  .sidebar-controls button {
    width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border);
    padding: 9px 6px; border-radius: 7px; font-weight: 800; font-size: 0.75rem; cursor: pointer;
  }
  body[class*="nvg-"] #nvg-btn { background: var(--accent); color: #000; border-color: var(--accent); }

  /* Main Area */
  main { padding: 14px 18px 60px 18px; max-width: 980px; zoom: var(--mz, 1); }
  aside > * { zoom: var(--sz, 1); }
  #sb-handle {
    position: fixed; top: 45%; right: calc(var(--sidebar-w) - 14px); width: 28px; height: 60px; z-index: 1100;
    border-radius: 14px; background: var(--accent); color: #000; opacity: 0.85; touch-action: none; cursor: col-resize;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1rem;
  }
  section { scroll-margin-top: 14px; margin-bottom: 30px; }
  .sec-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--border); padding-bottom: 6px; margin-bottom: 10px;
  }
  h2 { margin: 0; font-size: 1.1rem; color: var(--accent); letter-spacing: 0.5px; }
  .sec-reset {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 9px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
  }

  .sub-header.done { background: #3d003d; border-left-color: #ff00ff; color: #ff00ff; }
  .sub-header.collapsible { cursor: pointer; user-select: none; }
  .sub-header {
    background: var(--subhead); border-left: 4px solid var(--accent);
    padding: 6px 10px; margin: 14px 0 8px 0; font-weight: 800; font-size: 0.85rem;
    letter-spacing: 0.5px; color: var(--accent); text-transform: uppercase;
  }

  .alert-box {
    border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.85rem; line-height: 1.4;
    text-align: center; text-transform: uppercase; font-weight: 700;
  }
  /* Fixed colors: never changed by NVG modes */
  .alert-warning { background: rgba(239, 68, 68, 0.18); border: 2px solid #ef4444; color: #ef4444; }
  .alert-caution { background: rgba(250, 204, 21, 0.16); border: 2px solid #facc15; color: #facc15; }
  .alert-note { background: rgba(56, 189, 248, 0.16); border: 2px solid #38bdf8; color: #38bdf8; }
  .alert-title { font-weight: 900; display: block; margin-bottom: 4px; text-transform: uppercase; text-align: center; font-size: 1rem; letter-spacing: 1px; }

  .task {
    display: flex; align-items: flex-start; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 9px;
    padding: 11px 14px; margin-bottom: 7px; cursor: pointer; user-select: none; gap: 12px; flex-wrap: wrap;
  }
  .task.checked { background: var(--done-bg); border-color: var(--done-border); opacity: 0.82; }
  .task-left { display: flex; align-items: flex-start; gap: 12px; flex: 1 1 0; min-width: 0; }
  .checkbox {
    width: 24px; height: 24px; border: 2px solid var(--accent); border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-weight: 900;
    font-size: 1rem; flex-shrink: 0; margin-top: 1px;
  }
  .task.checked > .task-left .checkbox { background: var(--done-border); border-color: var(--done-border); color: #000; }
  .item-name { font-weight: 700; font-size: 0.96rem; }
  .item-sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; white-space: pre-line; line-height: 1.35; }





  .subtasks { flex: 0 0 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; padding-left: 36px; }
  .subtask { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 0.88rem; font-weight: 600; }
  .subtask.checked { background: var(--done-bg); border-color: var(--done-border); opacity: 0.85; }
  .checkbox.sm { width: 20px; height: 20px; font-size: 0.85rem; margin-top: 0; }
  .subtask.checked .checkbox { background: var(--done-border); border-color: var(--done-border); color: #000; }
  /* Photo window: colors are fixed, unaffected by NVG */
  #photo-popup {
    display: none; position: fixed; z-index: 1500; top: 8px; left: 8px; touch-action: none; user-select: none; cursor: move;
    width: min(calc(100vw - var(--sidebar-w) - 16px), 300px); background: #fff; border: 3px solid #fff; border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.7); overflow: hidden;
  }
  #photo-popup .pp-head { display: flex; justify-content: space-between; align-items: center; background: #000; color: #fff; font-weight: 800; font-size: 0.8rem; padding: 4px 8px; }
  #photo-popup .pp-btns { display: flex; gap: 14px; }
  #photo-popup .pp-head button { background: none; border: none; color: #fff; font-size: 1.4rem; padding: 0 6px; line-height: 1; cursor: pointer; }
  @keyframes mflash { 0%, 100% { opacity: 1; } 50% { opacity: 0.05; } }
  .sw-marker.flash, #photo-popup .pp-svg .flash { animation: mflash 0.7s steps(1) infinite; }
  #photo-popup .pp-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #photo-popup .pp-img { position: relative; line-height: 0; }
  #photo-popup img { width: 100%; display: block; filter: none; }
  #photo-popup .pp-empty { line-height: 1.2; padding: 50px 10px; text-align: center; color: #555; font-weight: 800; }
  .sw-marker { position: absolute; width: 10%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(255,0,255,0.14); border: 3px solid rgba(255,0,255,0.54); }
  .sw-knob { position: absolute; left: 50%; width: 26%; height: 50%; transform: translateX(-50%); background: rgba(255,0,255,0.54); border-radius: 4px; }
  /* overhead panel photo keeps the lighter markers */
  .pp-img.oh .sw-marker { background: rgba(255,0,255,0.07); border-color: rgba(255,0,255,0.27); }
  .pp-img.oh .sw-knob { background: rgba(255,0,255,0.27); }
  .sw-knob.norm { top: 8%; }
  .sw-knob.off { bottom: 8%; }
  .sw-knob.ctr { top: 25%; }

  #alert-popup {
    display: none; position: fixed; top: 0; bottom: 0; left: 0; right: var(--sidebar-w);
    z-index: 3500; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); cursor: pointer;
  }
  #alert-popup .ap-box { width: min(86%, 460px); margin: 0; padding: 18px 16px; font-size: calc(1rem * var(--g, 1)); background-color: #0b1220; box-shadow: 0 6px 24px rgba(0,0,0,0.7); }

  #choice-popup {
    display: none; position: fixed; top: 0; bottom: 0; left: 0; right: var(--sidebar-w);
    z-index: 3000; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55);
  }
  #choice-popup .cp-box { display: flex; flex-direction: column; gap: 14px; width: min(80%, 380px); }
  #choice-popup .cp-btn {
    padding: 22px 12px; font-size: calc(1.25rem * var(--g, 1)); font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase;
    background: var(--card); color: var(--accent); border: 3px solid var(--accent); border-radius: 14px;
    cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  }
  #choice-popup .cp-btn:active { background: var(--accent); color: #000; }

  #wait-msg {
    display: none; position: fixed; top: 50%; left: calc((100vw - var(--sidebar-w)) / 2); transform: translate(-50%, -50%);
    z-index: 2600; width: min(86%, 360px); max-height: 92vh; border-radius: 12px; overflow: hidden; pointer-events: none;
    border: 3px solid #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.8); line-height: 0; background: #000;
  }
  #wait-msg img { width: 100%; display: block; max-height: 92vh; object-fit: cover; filter: none; }
  #wait-msg .wm-text {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 10px; line-height: 1.25;
    background: rgba(220, 38, 38, 0.92); color: #fff; text-align: center;
    font-size: calc(1.15rem * var(--g, 1)); font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
  }
  #chrono {
    display: none; position: fixed; bottom: 10px; left: calc((100vw - var(--sidebar-w)) / 2); transform: translateX(-50%);
    z-index: 2000; flex-direction: column; align-items: center; gap: calc(6px * var(--g, 1));
    padding: calc(8px * var(--g, 1)); border-radius: 22px;
    background: linear-gradient(#1f2937, #0b0f14); border: 3px solid #1d4ed8; box-shadow: 0 6px 24px rgba(0,0,0,0.75);
  }
  #chrono-face { width: calc(270px * var(--g, 1)); height: calc(270px * var(--g, 1)); display: block; }
  #chrono .chrono-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
  #chrono .chrono-btns button {
    padding: calc(9px * var(--g, 1)) 2px; font-size: calc(0.78rem * var(--g, 1)); font-weight: 900; border-radius: 999px;
    background: #050505; color: #93c5fd; border: 2px solid #1d4ed8; cursor: pointer; letter-spacing: 0.5px;
  }
  #chrono .chrono-btns button:disabled { opacity: 0.35; }
  #chrono .chrono-btns button:active { background: #1d4ed8; color: #fff; }
  #timer-overlay {
    display: none; position: fixed; top: 14px; left: calc((100vw - var(--sidebar-w)) / 2); transform: translateX(-50%);
    z-index: 2000; flex-direction: column; align-items: center; justify-content: center;
    min-width: calc(340px * var(--g, 1)); padding: calc(20px * var(--g, 1)) calc(52px * var(--g, 1)); border-radius: 32px; pointer-events: none;
    background: rgba(2, 6, 23, 0.94); border: 6px solid var(--accent); color: var(--text);
    box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  }
  #timer-overlay .t-label { font-size: calc(1.5rem * var(--g, 1)); font-weight: 800; letter-spacing: 1px; color: var(--muted); }
  #timer-overlay .t-value { font-size: calc(8rem * var(--g, 1)); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
  #timer-overlay .t-unit { font-size: calc(1.5rem * var(--g, 1)); font-weight: 800; color: var(--muted); }
  #timer-overlay.flash { animation: tflash 0.5s steps(1) infinite; }
  @keyframes tflash {
    0%, 100% { background: rgba(2, 6, 23, 0.94); border-color: var(--accent); }
    50% { background: #ef4444; border-color: #fff; }
  }
  #timer-overlay.flash .t-value, #timer-overlay.flash .t-label, #timer-overlay.flash .t-unit { color: #fff; }

  .cas-wrap { flex: 0 0 100%; width: 100%; max-width: 100%; margin: 6px auto 0; }
  .cas-table { width: 100%; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; border: 2px solid #000; background: #fff; color: #000; }
  .cas-col { min-width: 0; border-right: 2px solid #000; padding: 6px 4px 10px; display: flex; flex-direction: column; gap: 4px; }
  .cas-col:last-child { border-right: none; }
  .cas-head { text-align: center; font-weight: 900; font-size: 0.85rem; color: #000; }
  .cas-count { text-align: center; font-weight: 700; font-size: 1.3rem; color: var(--text); margin-top: 8px; }
  .cas-counts { width: 100%; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .cas-item { text-align: center; font-weight: 900; font-size: clamp(0.5rem, 1.7vw, 0.66rem); padding: 4px 1px; border-radius: 2px; white-space: nowrap; overflow: hidden; }
  .cas-red { background: #ff0000; color: #fff; }
  .cas-blk { background: #000; color: #ffff00; }
  .cas-blkw { background: #000; color: #fff; }
  .item-action { font-weight: 800; color: var(--accent); font-size: 0.92rem; text-align: right; flex-shrink: 0; max-width: 45%; }
  .task.checked .item-name { text-decoration: line-through; color: var(--muted); }
  .rfm-disclaimer {
    font-size: 0.75rem; color: var(--muted); border: 1px dashed var(--border);
    padding: 8px 10px; border-radius: 8px; margin-bottom: 14px;
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <div class="brand-title">BELL 412EPX</div>
    <div class="brand-sub">BHT-412-FM-6 Rev. 15 (v1.1)</div>
  </div>
  <nav id="nav-tabs"></nav>
  <div class="sidebar-controls">
    <button id="nvg-btn" onclick="cycleNVG()">NVG MODE: OFF</button>
    <button onclick="resetAll()">RESET ALL PHASES</button>
  </div>
</aside>

<main>
  <div class="rfm-disclaimer">
    <strong>NORMAL PROCEDURES — COMPLETE (EXTERIOR TO ENGINE SHUTDOWN):</strong> Based on BHT-412-FM-6 Rev. 15 (v1.1 · Eff. 20/11/2026). Emergency procedures are not included in this issue; use RFM Section 3.
  </div>
  <div id="checklist-container"></div>
</main>

<script>
const manifest = {
  name: "Bell 412EPX Normal Checklist",
  short_name: "412EPX",
  start_url: ".",
  display: "standalone",
  orientation: "landscape",
  background_color: "#0b1120",
  theme_color: "#0b1120",
  icons: [{
    src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1120'/%3E%3Ctext x='50' y='58' font-family='sans-serif' font-size='28' font-weight='bold' fill='%2322c55e' text-anchor='middle'%3E412EPX%3C/text%3E%3C/svg%3E",
    sizes: "192x192", type: "image/svg+xml"
  }]
};
document.getElementById("pwa-manifest").setAttribute("href", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest)));

const checklistData = [
  {
    id: "ext", navTitle: "EXT", title: "EXTERIOR CHECK (412-FM-6-S02 2-3-B)",
    blocks: [
      { type: "warning", title: "WARNING", text: "IF HELICOPTER HAS BEEN EXPOSED TO SNOW OR ICING CONDITIONS, SNOW AND ICE SHALL BE REMOVED PRIOR TO FLIGHT." },
      { type: "sub", title: "FUSELAGE - FRONT", collapsible: true },
      { challenge: "1. Cabin nose", response: "Condition", sub: "all glass clean · wipers stowed" },
      { challenge: "2. Pitot tubes", response: "Unobstructed" },
      { challenge: "3. Static ports", response: "Unobstructed" },
      { challenge: "4. Cabin nose ventilators", response: "Unobstructed" },
      { challenge: "5. Nose compartment door", response: "Secure" },
      { challenge: "6. Battery vent and drain tubes", response: "Unobstructed" },
      { challenge: "7. Searchlight and landing light", response: "Stowed" },
      { challenge: "8. Antennas", response: "Condition and security" },
      { challenge: "9. Rear view mirror", response: "Secure and clean" },

      { type: "sub", title: "FUSELAGE - CABIN LEFT SIDE", collapsible: true },
      { challenge: "1. Copilot door", response: "Condition and operation", sub: "glass clean · emergency release handles secure" },
      { challenge: "2. Position lights", response: "Condition" },
      { challenge: "3. Passenger door", response: "Condition and operation", sub: "glass clean · pop-out windows" },
      { challenge: "4. Landing gear", response: "Condition", sub: "handling wheels removed" },

      { type: "sub", title: "FUSELAGE - AFT LEFT SIDE", collapsible: true },
      { challenge: "1. No. 1 engine compartment", response: "Check" },
      { challenge: "2. No. 1 engine oil level", response: "Verify presence of oil", sub: "check oil level · filler cap secured" },
      { challenge: "3. Engine fire extinguisher", response: "Check pressure and temperature" },
      { challenge: "4. Combining gearbox filter", response: "Check bypass indicator retracted" },
      { challenge: "5. Oil cooler blower", response: "Unobstructed" },
      { challenge: "6. Avionics compartments", response: "Security of all components" },
      { challenge: "7. Access doors and engine cowling", response: "Secured" },
      { challenge: "8. Drain lines", response: "Clean and Unobstructed" },
      { challenge: "9. Engine exhaust ejectors", response: "Unobstructed, covers removed" },
      { challenge: "10. Oil coolers", response: "No evidence of leakage" },

      { type: "sub", title: "TAILBOOM", collapsible: true },
      { challenge: "1. Tailboom", response: "Condition; access covers secured" },
      { challenge: "2. Tail rotor driveshaft covers", response: "Secured" },
      { type: "caution", title: "CAUTION", text: "DO NOT BEND ELEVATOR TRAILING EDGE TAB" },
      { challenge: "3. Elevator", response: "Condition and security", sub: "spring check" },
      { challenge: "4. Tail rotor (90°) gearbox", response: "Verify presence of oil", sub: "check oil level, filler cap and chip detector secured" },
      { challenge: "5. Tail rotor blades", response: "Visually check condition and cleanliness" },
      { challenge: "6. Tail rotor", response: "Condition and free movement on flapping axis" },
      { challenge: "7. Tail rotor yoke", response: "Evidence of static stop contact damage" },
      { challenge: "8. Tail skid", response: "Condition and security" },
      { challenge: "9. Intermediate (42°) gearbox", response: "Verify presence of oil", sub: "check oil level, filler cap and chip detector secured" },
      { challenge: "10. TEMP-PLATES (42° coupling)", response: "Check for color and grease leakage" },
      { challenge: "11. Elevator", response: "Condition and security" },
      { challenge: "12. Tailboom", response: "Condition" },
      { challenge: "13. Tailboom strakes", response: "Inspect", sub: "check for damage, deformation and security of attachment" },
      { challenge: "14. Vertical fin", response: "Inspect", sub: "check structure for damage, deformation, and security of attachment" },
      { challenge: "15. Baggage compartment", response: "Cargo secured", sub: "smoke detector condition and door secured" },

      { type: "sub", title: "FUSELAGE - AFT RIGHT SIDE", collapsible: true },
      { challenge: "1. Aft compartment", response: "Check unobstructed" },
      { challenge: "2. Tail rotor actuator", response: "Check" },
      { challenge: "3. Tailboom attachment", response: "No evidence of attachment bolt slippage" },
      { challenge: "4. All system connections", response: "Secure" },
      { challenge: "5. Engine fire extinguisher", response: "Check pressure and temperature" },
      { challenge: "6. C-box oil level", response: "Verify presence of oil and confirm level" },
      { challenge: "7. TEMP-PLATES (tail rotor drive coupling)", response: "Check for color and grease leakage" },
      { challenge: "8. Oil cooler blower", response: "Unobstructed" },
      { challenge: "9. Avionics compartment", response: "Security of all components" },
      { challenge: "10. No. 2 engine compartment", response: "Check" },
      { challenge: "11. No. 2 engine oil level", response: "Verify presence of oil", sub: "check oil level · filler cap secured" },

const STORAGE_KEY = "bell412epx_full_state";
const NVG_KEY = "bell412epx_nvg_level";
const nvgLevels = ["off", "nvg-dim", "nvg-med", "nvg-high"];
const nvgLabels = ["NVG MODE: OFF", "NVG: DIM", "NVG: MEDIUM", "NVG: HIGH"];
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let nvgIdx = parseInt(localStorage.getItem(NVG_KEY) || "0", 10);

function applyNVG() {
  document.body.classList.remove("nvg-dim", "nvg-med", "nvg-high");
  if (nvgIdx > 0) document.body.classList.add(nvgLevels[nvgIdx]);
  document.getElementById("nvg-btn").textContent = nvgLabels[nvgIdx];
  document.getElementById("theme-meta").setAttribute("content", nvgIdx > 0 ? "#000500" : "#0b1120");
}

function cycleNVG() {
  nvgIdx = (nvgIdx + 1) % nvgLevels.length;
  localStorage.setItem(NVG_KEY, nvgIdx);
  applyNVG();
}

const CAS_COLS = [
  { h: "LEFT", n: 9, items: [["FUEL 1 PRESS","r"],["ENG 1 OIL PRESS","r"],["FUEL 1 TRANSFER","y"],["INVERTER 1","y"],["AP 1","y"],["FUEL 1 BOOST","y"],["HYD 1 PRESS","y"],["PART SEP 1 OFF","y"],["FUEL 1 CLOSED","y"]] },
  { h: "CENTER", n: 4, items: [["DUAL GEN","r"],["C BOX OIL PRESS","r"],["XMSN OIL PRESS","r"],["RPM SETTING","w"]] },
  { h: "RIGHT", n: 9, items: [["FUEL 2 PRESS","r"],["ENG 2 OIL PRESS","r"],["FUEL 2 TRANSFER","y"],["INVERTER 2","y"],["AP 2","y"],["FUEL 2 BOOST","y"],["HYD 2 PRESS","y"],["PART SEP 2 OFF","y"],["FUEL 2 CLOSED","y"]] }
];
function casHTML() {
  const cls = { r: "cas-red", y: "cas-blk", w: "cas-blkw" };
  return `<div class="cas-wrap"><div class="cas-counts">${CAS_COLS.map(c => `<div class="cas-count">${c.n}</div>`).join("")}</div><div class="cas-table">` +
    CAS_COLS.map(c => `<div class="cas-col"><div class="cas-head">${c.h}</div>${c.items.map(it => `<div class="cas-item ${cls[it[1]]}">${it[0]}</div>`).join("")}</div>`).join("") +
    `</div></div>`;
}

/* ---- Digital chronometer (hh:mm:ss) shown at the bottom of the screen after step 5 START switch ---- */
let chronoRunning = false, chronoStartAt = 0, chronoElapsed = 0, chronoTimer = null;
function chronoMs() { return chronoElapsed + (chronoRunning ? Date.now() - chronoStartAt : 0); }
function chronoFmt(ms) {
  const t = Math.floor(ms / 1000), p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(t / 3600))}:${p(Math.floor(t / 60) % 60)}:${p(t % 60)}`;
}
function chronoRefresh() {
  const ms = chronoMs();
  const T = document.getElementById("chrono-time");
  if (T) T.textContent = chronoFmt(ms);
  const st = document.getElementById("chrono-state");
  if (st) st.textContent = chronoRunning ? "RUN" : "STOP";
  const rot = (id, deg, x, y) => { const g = document.getElementById(id); if (g) g.setAttribute("transform", `rotate(${deg} ${x} ${y})`); };
  rot("chrono-s", ((ms / 1000) % 60) * 6, 150, 150);          /* second hand (smooth sweep) */
  rot("chrono-m", ((ms / 60000) % 60) * 6, 150, 150);         /* minute hand */
  rot("chrono-h", ((ms / 3600000) % 12) * 30, 150, 150);      /* hour hand */
  rot("chrono-t", ((ms % 1000) / 1000) * 360, 202, 150);      /* small sub-dial: tenths turning once per second */
  const bs = document.getElementById("chrono-start"), bp = document.getElementById("chrono-stop");
  if (bs) bs.disabled = chronoRunning;
  if (bp) bp.disabled = !chronoRunning;
}
function chronoStart() {
  if (chronoRunning) return;
  chronoStartAt = Date.now(); chronoRunning = true;
  chronoTimer = setInterval(chronoRefresh, 50);
  chronoRefresh();
}
function chronoStop() {
  if (!chronoRunning) return;
  chronoElapsed += Date.now() - chronoStartAt; chronoRunning = false;
  clearInterval(chronoTimer); chronoTimer = null;

}
function chronoRestart() {   /* back to 00:00:00 and running again */
  chronoStop(); chronoElapsed = 0; chronoStart();
}

/* red circular arrow (clockwise) following a rotary control's arrow, angles in degrees on screen (y down) */
function arcArrow(cx, cy, r, a1, a2) {
  const rad = d => d * Math.PI / 180;
  const x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
  const x2 = cx + r * Math.cos(rad(a2)), y2 = cy + r * Math.sin(rad(a2));
  const tx = -Math.sin(rad(a2)), ty = Math.cos(rad(a2)), nx = Math.cos(rad(a2)), ny = Math.sin(rad(a2));
  const head = `${x2 + tx * 20},${y2 + ty * 20} ${x2 + nx * 10},${y2 + ny * 10} ${x2 - nx * 10},${y2 - ny * 10}`;
  return `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2} ${y2}" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"/><polygon points="${head}" fill="#ff0000"/>`;
}
let lastMarked = null;   /* most recently checked step / sub-step: its switch flashes until the next one is checked */
/* ---- Photo window: floating, draggable, with tap-zoom rules per photo ---- */
let ppX = 8, ppY = 8;
let photoLayout = null, photoDragged = false;   /* "br-half": half size, bottom right of the checklist (START step 2 only) */
const ppWs = {};  /* width per photo, set by + / − */
function resizePhoto(d) { const P = PANELS[photoOpen]; if (!P) return; ppWs[photoOpen] = Math.max(220, Math.min(1400, (ppWs[photoOpen] || P.w) + d)); updatePhoto(); }
let zoomed = {}, zoomFit = {};
let blockClicksUntil = 0;
document.addEventListener("click", ev => {
  if (Date.now() < blockClicksUntil) { ev.stopPropagation(); ev.preventDefault(); }
}, true);
function toggleSub(k) {
  state[k] = !state[k];
  if (state[k]) lastMarked = k; else if (lastMarked === k) lastMarked = null;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderApp();
}
/* START step 2 photo: anchored at the bottom right (it covers the NVG / RESET buttons) and as large as possible
   upwards, up to the lower edge of sub-step d) */
function sideSlot(P) {
  const dRows = [...document.querySelectorAll('.subtask[data-sub^="start_"][data-sub$="_d"]')].filter(e => e.offsetParent !== null);
  const limit = dRows.length ? dRows[0].getBoundingClientRect().bottom + 8 : window.innerHeight * 0.4;
  const headH = 30;   /* photo title bar */
  const maxTotal = window.innerHeight - 8 - Math.max(limit, window.innerHeight * 0.3);
  const w = Math.max(100, Math.floor(Math.min(document.documentElement.clientWidth - 16, (maxTotal - headH) * P.ar)));
  return { w };
}
function closePhoto() { photoOpen = null; updatePhoto(); }
function updatePhoto() {
  let el = document.getElementById("photo-popup");
  if (!photoOpen) { zoomed = {}; zoomFit = {}; if (el) el.style.display = "none"; return; }
  if (!el) { el = document.createElement("div"); el.id = "photo-popup"; document.body.appendChild(el); }
  const P = PANELS[photoOpen];
  let marks = "", arrows = "";
  checklistData.forEach(sec => {
    if (sec.id !== currentSec) return;   /* markers only from the section on screen */
    let c = 0;
    sec.blocks.forEach(b => {
      if (b.type) return;
      const key = `${sec.id}_${c++}`;
      if (b.photoRef === photoOpen && b.mk && state[key]) (Array.isArray(b.mk) ? b.mk : [b.mk]).forEach(g => g.pts.forEach(p => {
        marks += `<div class="sw-marker${lastMarked === key ? " flash" : ""}" style="left:${p[0]}%;top:${p[1]}%"><div class="sw-knob ${g.pos}"></div></div>`;
      }));
      if (b.photoRef === photoOpen && b.subtasks) b.subtasks.forEach(st => {
        if (state[`${key}_${st.id}`] && st.arrows) st.arrows.forEach(c => { arrows += `<g class="${lastMarked === `${key}_${st.id}` ? "flash" : ""}">${arcArrow(c[0], c[1], 60, 130, 388)}</g>`; });
        if (state[`${key}_${st.id}`] && st.mk) st.mk.pts.forEach(p => {
          marks += `<div class="sw-marker${lastMarked === `${key}_${st.id}` ? " flash" : ""}" style="left:${p[0]}%;top:${p[1]}%"><div class="sw-knob ${st.mk.pos}"></div></div>`;
        });
      });
    });
  });
  el.innerHTML = `<div class="pp-head"><span>⠿ ${P.title}</span><span class="pp-btns"><button onclick="resizePhoto(-60)">−</button><button onclick="resizePhoto(60)">+</button><button onclick="closePhoto()">✕</button></span></div>` +
    `<div class="pp-img${photoOpen === "oh" ? " oh" : ""}"><img src="${P.photo}" alt="${P.title}">${marks}${arrows ? `<svg class="pp-svg" viewBox="0 0 ${P.vb[0]} ${P.vb[1]}">${arrows}</svg>` : ""}</div>`;
  const slot = photoLayout === "br-half" ? sideSlot(P) : null;
  const wpx = slot ? Math.round(slot.w * (zoomed[photoOpen] ? 0.5 : 1)) : Math.round(Math.min((ppWs[photoOpen] || P.w) * (P.toggle ? (zoomed[photoOpen] ? 2 : 1) : Math.pow(1.5, P.zoom ? (zoomed[photoOpen] || 0) : 0)), zoomFit[photoOpen] || 99999));
  el.style.width = zoomFit[photoOpen] ? `${wpx}px` : `min(calc(100vw - var(--sidebar-w) - 16px), ${wpx}px)`;
  if (P.fullW) {   /* opens at the full width of the application; a tap toggles to a small size and back */
    el.style.width = (zoomed[photoOpen] ? P.w : document.documentElement.clientWidth) + "px";
    if (!zoomed[photoOpen]) ppX = 0;
  }
  if (ppX + el.offsetWidth > window.innerWidth) ppX = Math.max(0, window.innerWidth - el.offsetWidth);
  if (slot && !photoDragged) {   /* bottom right corner */
    el.style.display = "block";
    ppX = Math.max(0, document.documentElement.clientWidth - el.offsetWidth - 8);
    ppY = Math.max(0, window.innerHeight - el.offsetHeight - 8);
  }
  el.style.left = ppX + "px";
  el.style.top = ppY + "px";
  el.style.display = "block";
  if (!el._drag) {
    el._drag = true;
    let sx = 0, sy = 0, ox = 0, oy = 0, on = false, startTarget = null;
    el.addEventListener("pointerdown", ev => {
      if (ev.target.closest("button")) return;
      on = true; startTarget = ev.target; sx = ev.clientX; sy = ev.clientY; ox = ppX; oy = ppY;
      el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener("pointermove", ev => {
      if (!on) return;
      photoDragged = true;
      ppX = Math.max(0, Math.min(window.innerWidth - 60, ox + ev.clientX - sx));
      ppY = Math.max(0, Math.min(window.innerHeight - 40, oy + ev.clientY - sy));
      el.style.left = ppX + "px"; el.style.top = ppY + "px";
    });
    const end = () => { on = false; };
    el.addEventListener("pointerup", ev => {
      const P = PANELS[photoOpen];
      if (on && P && P.zoom && startTarget && startTarget.closest && startTarget.closest(".pp-img") &&
          Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) {
        blockClicksUntil = Date.now() + 10;   /* swallow the click that follows the tap */
        const panel = photoOpen;
        const apply = (next, snap) => {
          if (next === 0) {
            /* shrinking: wait a moment so the finger is lifted before the photo gets smaller */
            setTimeout(() => { if (photoOpen === panel) { zoomed[panel] = 0; updatePhoto(); } }, 10);
          } else {
            zoomed[panel] = next; if (snap) { ppX = 0; ppY = 0; } updatePhoto();
          }
        };
        if (P.fullW) {
          if (zoomed[panel]) { zoomed[panel] = 0; ppX = 0; updatePhoto(); }   /* back to full width */
          else setTimeout(() => { if (photoOpen === panel) { zoomed[panel] = 1; updatePhoto(); } }, 10);   /* small */
          end(); return;
        }
        if (P.toggle) { apply(zoomed[panel] ? 0 : 1, false); end(); return; }
        /* each click zooms x1.5 until the photo fills the screen; next click returns to normal size */
        const base = ppWs[photoOpen] || P.w, lvl = zoomed[photoOpen] || 0;
        const img = el.querySelector("img");
        const head = el.querySelector(".pp-head");
        const aspect = img && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1;
        let fitW = Math.floor(document.documentElement.clientWidth);
        if (P.fitH) fitW = Math.min(fitW, Math.floor((window.innerHeight - (head ? head.offsetHeight : 30)) * aspect));
        zoomFit[photoOpen] = fitW;
        const cur = Math.min(base * Math.pow(1.5, lvl), fitW);
        if (cur >= fitW - 1) apply(0, false);
        else apply(lvl + 1, base * Math.pow(1.5, lvl + 1) >= fitW - 1);
      }
      end();
    });
    el.addEventListener("pointercancel", end);
  }
}

const openSubs = {};
function subGroups(sec) {
  const groups = []; let cur = null, c = 0;
  sec.blocks.forEach(b => {
    if (b.type === "sub") { cur = { title: b.title, idxs: [] }; groups.push(cur); }
    else if (!b.type) { if (cur) cur.idxs.push(c); c++; }
  });
  return groups;
}
let currentSec = checklistData[0].id;   /* only one section displayed at a time, starting with EXT */
function showSection(id) {
  currentSec = id;
  photoOpen = null;
  renderApp();
  window.scrollTo(0, 0);
  const m = document.querySelector("main"); if (m) m.scrollTop = 0;
}
/* ---- Adjustable divider between the checklist and the right-hand sections column ---- */
/* Automatic adaptation: tablet (HMD T21, wide) keeps the original layout; on a phone the sections column is
   narrower and every text is scaled down so that nothing is unreadable. */
const TABLET_SB = 215;
function vwidth() { return document.documentElement.clientWidth; }
function isPhone() { return vwidth() < 600; }
function textScale() {           /* 1 on tablet, 0.62 .. 1 on phones (320 px .. 600 px wide) */
  return isPhone() ? Math.max(0.62, Math.min(1, 0.62 + (vwidth() - 320) / 280 * 0.38)) : 1;
}
function defaultSb() { return isPhone() ? Math.max(100, vwidth() * 0.3) : TABLET_SB; }
let sbFrac = parseFloat(localStorage.getItem("bell412epx_sbf")) || 0;   /* 0 = default width */
let sbW = defaultSb();
function applySidebar(w) {
  const vw = vwidth(), def = defaultSb(), g = textScale();
  sbW = Math.max(isPhone() ? 80 : 130, Math.min(vw * 0.6, w));
  const root = document.documentElement.style;
  root.setProperty("--sidebar-w", sbW + "px");
  root.setProperty("--g", g.toFixed(3));
  /* checklist text follows the width of its column (1 x g = default layout) */
  const mz = Math.max(0.5, Math.min(1.6, (vw - sbW) / Math.max(vw - def, 100))) * g;
  root.setProperty("--mz", mz.toFixed(3));
  /* sections column text follows its own width */
  root.setProperty("--sz", (Math.max(0.7, Math.min(1.5, sbW / def)) * g).toFixed(3));
}
function applySavedSidebar() { applySidebar(sbFrac ? sbFrac * vwidth() : defaultSb()); }
function initSidebarResizer() {
  applySavedSidebar();
  const h = document.createElement("div");
  h.id = "sb-handle";
  h.textContent = "⇔";
  document.body.appendChild(h);
  let on = false;
  h.addEventListener("pointerdown", ev => { on = true; h.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  h.addEventListener("pointermove", ev => {
    if (!on) return;
    applySidebar(document.documentElement.clientWidth - ev.clientX);
    if (photoOpen) updatePhoto();
  });
  const end = () => { if (on) { on = false; sbFrac = sbW / vwidth(); try { localStorage.setItem("bell412epx_sbf", String(sbFrac)); } catch (e) {} renderApp(); } };
  h.addEventListener("pointerup", end);
  h.addEventListener("pointercancel", end);
  window.addEventListener("resize", () => { applySavedSidebar(); renderApp(); });
}

function renderApp() {
  const nav = document.getElementById("nav-tabs");
  const container = document.getElementById("checklist-container");
  nav.innerHTML = "";
  container.innerHTML = "";

  checklistData.forEach(sec => {
    const allTasks = sec.blocks.filter(b => !b.type);
    const tasksOnly = allTasks.filter(b => !(b.hideIf && b.hideIf === state._choice));
    const doneCount = allTasks.filter((b, idx) => !(b.hideIf && b.hideIf === state._choice) && state[`${sec.id}_${idx}`]).length;

    const a = document.createElement("a");
    a.href = `#${sec.id}`;
    a.id = `nav_${sec.id}`;
    a.innerHTML = `<span>${sec.navTitle}</span><span class="badge">${doneCount}/${tasksOnly.length}</span>`;
    a.onclick = (ev) => { ev.preventDefault(); showSection(sec.id); };
    nav.appendChild(a);

    const section = document.createElement("section");
    section.id = sec.id;
    section.style.display = sec.id === currentSec ? "" : "none";
    section.innerHTML = `
      <div class="sec-header">
        <h2>${sec.title}</h2>
        <button class="sec-reset" onclick="resetSection('${sec.id}')">RESET</button>
      </div>
    `;

    let taskCounter = 0;
    let hiding = false;
    sec.blocks.forEach(b => {
      if (b.type === "sub") {
        const sub = document.createElement("div");
        sub.className = "sub-header";
        if (b.collapsible) {
          const open = !!openSubs[b.title];
          hiding = !open;
          sub.classList.add("collapsible");
          let prog = "";
          if (sec.accordion) {
            const g = subGroups(sec).find(x => x.title === b.title);
            const done = g.idxs.filter(i => state[`${sec.id}_${i}`]).length;
            const finished = done === g.idxs.length && done > 0;
            if (finished) sub.classList.add("done");
            prog = `   ${finished ? "✓ " : ""}${done}/${g.idxs.length}`;
          }
          sub.textContent = `${open ? "▼" : "▶"}  ${b.title}${prog}`;
          sub.onclick = () => {
            if (sec.accordion) sec.blocks.forEach(x => { if (x.type === "sub") openSubs[x.title] = false; });  /* one sub-section at a time */
            openSubs[b.title] = !open;
            renderApp();
          };
        } else {
          hiding = false;
          sub.textContent = b.title;
        }
        section.appendChild(sub);
      } else if (hiding || (b.hideIf && b.hideIf === state._choice)) {
        if (!b.type) taskCounter++;
      } else if (b.type === "warning" || b.type === "caution" || b.type === "note") {
        const box = document.createElement("div");
        box.className = `alert-box alert-${b.type}`;
        box.innerHTML = `<span class="alert-title">${b.title}</span>${b.text.replace(/\n/g, "<br>")}`;
        section.appendChild(box);
      } else {
        const idx = taskCounter++;
        const key = `${sec.id}_${idx}`;
        const isChecked = !!state[key];
        const task = document.createElement("div");
        task.className = `task ${isChecked ? "checked" : ""}`;
        task.onclick = () => { if (sec.id === "shutdown" && idx >= 10 && timerId && !state[key]) { showWaitMsg(); return; } if (b.closePhoto) photoOpen = null; if (b.chrono) { if (!state[key]) showChrono(); else chronoExit(); }
          if (b.photo) { photoOpen = state[key] ? null : b.photo; photoLayout = (!state[key] && b.photoLayout) || null; photoDragged = false; } toggleTask(key, b.timer, b.popup, b.chain); };
        task.innerHTML = `
          <div class="task-left">
            <div class="checkbox">${isChecked ? "✓" : ""}</div>
            <div>
              <div class="item-name">${b.challenge}</div>
              ${b.sub ? `<div class="item-sub">${b.sub}</div>` : ""}
            </div>
          </div>
          <div class="item-action">${b.respBatt && state._choice === "batt" ? b.respBatt : b.response}</div>
          ${b.cas ? casHTML() : ""}
          ${b.subtasks ? `<div class="subtasks">${b.subtasks.map(st => {
            const on = !!state[`${key}_${st.id}`];
            return `<div class="subtask ${on ? "checked" : ""}" data-sub="${key}_${st.id}"><div class="checkbox sm">${on ? "✓" : ""}</div><div>${st.id}) ${st.text}</div></div>`;
          }).join("")}</div>` : ""}
        `;
        task.querySelectorAll(".subtask").forEach(el => {
          el.onclick = (ev) => { ev.stopPropagation(); toggleSub(el.dataset.sub); };
        });
        section.appendChild(task);
      }
    });

    container.appendChild(section);
  });
  updateActiveNav();
  updatePhoto();
}

function toggleTask(key, timerSec, popup, chain) {
  state[key] = !state[key];
  if (state[key]) lastMarked = key; else if (lastMarked === key) lastMarked = null;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderApp();
  const km = key.match(/^(\w+)_(\d+)$/);
  if (km && state[key]) {
    const sec = checklistData.find(x => x.id === km[1]);
    if (sec && sec.accordion) {
      const g = subGroups(sec).find(x => x.idxs.includes(+km[2]));
      if (g && g.idxs.every(i => state[`${sec.id}_${i}`])) {
        setTimeout(() => { openSubs[g.title] = false; renderApp(); }, 400);   /* sub-section finished: hide it */
      }
    }
  }
  if (timerSec) { if (state[key]) startTimer(timerSec); else stopTimer(); }
  if (popup) { if (state[key]) showChoicePopup(); else hideChoicePopup(); }
  if (chain) { if (state[key] && state._choice === chain) startAlertChain(); else hideAlertPopup(); }
}

/* ---- Start choice: sets the condition (batt / ext) ---- */
function chooseStart(choice) {
  state._choice = choice;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  hideChoicePopup();
  renderApp();
}

/* ---- Chained alert popups (after step 23, BATT start only) ---- */
const ALERT_CHAIN = [
  { cls: "alert-caution", title: "CAUTION", text: "DURING RPM INCREASE, ANY ABNORMAL INCREASE IN 1/REV VIBRATION MAY INDICATE ONE OR MORE MAIN DROOP RESTRAINERS FAILED TO DISENGAGE FROM STATIC POSITION. VERIFY PROPER OPERATION PRIOR TO FLIGHT." },
  { cls: "alert-note", title: "NOTE", text: "IF GEN 1 / GEN 2 DOES NOT ENGAGE RESET THEN ON" },
  { cls: "alert-caution", title: "CAUTION", text: "ONLY BATTERY BUS 2 SWITCH SHOULD REMAIN ON WITH BOTH GENERATORS OPERATING." }
];
let alertStep = -1;
function startAlertChain() { alertStep = 0; showAlertStep(); }
function showAlertStep() {
  let el = document.getElementById("alert-popup");
  if (!el) {
    el = document.createElement("div");
    el.id = "alert-popup";
    el.onclick = nextAlertStep;
    document.body.appendChild(el);
  }
  const a = ALERT_CHAIN[alertStep];
  el.innerHTML = `<div class="alert-box ${a.cls} ap-box"><span class="alert-title">${a.title}</span>${a.text}</div>`;
  el.style.display = "flex";
}
function nextAlertStep() {
  alertStep++;
  if (alertStep >= ALERT_CHAIN.length) hideAlertPopup(); else showAlertStep();
}
function hideAlertPopup() {
  alertStep = -1;
  const el = document.getElementById("alert-popup");
  if (el) el.style.display = "none";
}

/* ---- Start choice popup (no function, just dismisses) ---- */
function showChoicePopup() {
  let el = document.getElementById("choice-popup");
  if (!el) {
    el = document.createElement("div");
    el.id = "choice-popup";
    el.innerHTML = '<div class="cp-box"><button class="cp-btn" onclick="chooseStart(\'batt\')">BATT PWR START</button><button class="cp-btn" onclick="chooseStart(\'ext\')">EXT PWR START</button></div>';
    document.body.appendChild(el);
  }
  el.style.display = "flex";
}
function hideChoicePopup() {
  const el = document.getElementById("choice-popup");
  if (el) el.style.display = "none";
}

/* ---- Countdown timer overlay ---- */
let timerId = null, timerEnd = 0;
function getTimerEl() {
  let el = document.getElementById("timer-overlay");
  if (!el) {
    el = document.createElement("div");
    el.id = "timer-overlay";
    el.innerHTML = '<div class="t-label">MGT STABILIZE</div><div class="t-value" id="t-value">60</div><div class="t-unit">SEC</div>';
    document.body.appendChild(el);
  }
  return el;
}
function startTimer(sec) {
  stopTimer();
  timerEnd = Date.now() + sec * 1000;
  const el = getTimerEl();
  el.style.display = "flex";
  tickTimer();
  timerId = setInterval(tickTimer, 200);
}
function tickTimer() {
  const remaining = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
  const el = getTimerEl();
  document.getElementById("t-value").textContent = remaining;
  el.classList.toggle("flash", remaining <= 5 && remaining > 0);
  if (remaining <= 0) stopTimer();
}

function hideWaitMsg() {
  const el = document.getElementById("wait-msg");
  if (el) el.style.display = "none";
}
function stopTimer() {
  hideWaitMsg();
  if (timerId) { clearInterval(timerId); timerId = null; }
  const el = document.getElementById("timer-overlay");
  if (el) { el.style.display = "none"; el.classList.remove("flash"); }
}

function resetSection(secId) {
  if (secId === "prestart") photoOpen = null;
  stopTimer();
  hideChoicePopup();
  hideAlertPopup();
  if (secId === "prestart") delete state._choice;
  Object.keys(state).forEach(k => { if (k.startsWith(secId + "_")) delete state[k]; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderApp();
}

function resetAll() {
  chronoExit();
  photoOpen = null;
  stopTimer();
  hideChoicePopup();
  hideAlertPopup();
  Object.keys(openSubs).forEach(k => delete openSubs[k]);
  state = {};
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderApp();
}

function updateActiveNav() {
  document.querySelectorAll("nav a").forEach(a => {
    a.classList.toggle("active", a.id === `nav_${currentSec}`);
  });
}

applyNVG();
initSidebarResizer();
renderApp();
</script>
